name: Baseline CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/run_sensor_experiment.py --help > /dev/null
      - run: python3 scripts/analyze_sensor_runs.py --help > /dev/null
      - run: bash -n scripts/run_benchmarks.sh
      - run: bash -n scripts/run_comparison.sh
      - run: bash -n scripts/run_shm_path_benchmark.sh
      - run: bash -n scripts/run_shm_load.sh
      - run: bash -n scripts/test_ros_sensor_bridge.sh
  ros-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build baseline and adapter
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths robotcore_ros --packages-select robotcore_baseline --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Run DDS adapter smoke test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          timeout 20s ros2 run robotcore_baseline dds_adapter_smoke
      - name: Cross-process DDS benchmark functional smoke (not performance evidence)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          ./install/robotcore_baseline/lib/robotcore_baseline/transport_bench_dds --role responder --payload-bytes 128 > /tmp/rc-dds-server.log 2>&1 &
          responder=$!
          trap 'kill "$responder" 2>/dev/null || true; wait "$responder" 2>/dev/null || true' EXIT
          sleep 3
          if ! timeout 45s ./install/robotcore_baseline/lib/robotcore_baseline/transport_bench_dds --role initiator --payload-bytes 128 --samples 30 --warmup 15 --timeout-ms 2000 --discovery-timeout-ms 18000 --run-id ci-dds --csv /tmp/rc-dds.csv; then
            cat /tmp/rc-dds-server.log >&2
            exit 1
          fi
          test "$(wc -l < /tmp/rc-dds.csv)" -eq 31
      - name: End-to-end comparison runner smoke (not research-grade results)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          RUNS=1 PAYLOADS=64 SAMPLES=20 WARMUP=5 TIMEOUT_MS=2000 MAX_RUN_SECS=60 \
            bash scripts/run_comparison.sh
          test -n "$(find results/reports -name comparison.md -size +0c -print -quit)"
          test -n "$(find results/reports -name resources.md -size +0c -print -quit)"
          test -n "$(find results/raw -name '*.resources.csv' -size +0c -print -quit)"
      - name: Four-mode synthetic LiDAR frame smoke (not actual sensor_msgs)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          RUNS=1 PAYLOAD_PROFILE=laser360 SAMPLES=12 WARMUP=5 TIMEOUT_MS=2000 MAX_RUN_SECS=60 \
            bash scripts/run_comparison.sh
          grep -rl 'laser360' results/reports/ | grep -q .

      - name: Complete LaserScan metadata and CDR envelope roundtrip tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          timeout 20s ros2 run robotcore_baseline scan_codec_test
      - name: Strict complete native LaserScan sequence over DDS (reference)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          timeout 65s bash scripts/test_ros_sensor_bridge.sh dds 250 10

      - name: Matched-topology DDS CDR bridge with raw per-frame observations
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          SENSOR_EVENTS_DIR=/tmp/rc-typed-dds-bridge timeout 75s bash scripts/test_ros_sensor_bridge.sh dds_bridge 250 10
          test -s /tmp/rc-typed-dds-bridge/source_events.csv
          test -s /tmp/rc-typed-dds-bridge/sink_events.csv
          test -s /tmp/rc-typed-dds-bridge/paired_events.csv
          python3 -c "import json; s=json.load(open('/tmp/rc-typed-dds-bridge/summary.json')); assert s['complete_contiguous_delivery'] and s['sink_frames'] == 250"

      - name: Strict complete native LaserScan sequence over Unix IPC
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          SENSOR_EVENTS_DIR=/tmp/rc-typed-ipc timeout 65s bash scripts/test_ros_sensor_bridge.sh ipc 250 10
          test -s /tmp/rc-typed-ipc/paired_events.csv

      - name: Strict complete native LaserScan sequence over bounded SHM
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          SENSOR_EVENTS_DIR=/tmp/rc-typed-shm timeout 65s bash scripts/test_ros_sensor_bridge.sh shm 250 10
          test -s /tmp/rc-typed-shm/paired_events.csv

      - name: Strict complete native LaserScan sequence over persistent SHM
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          SENSOR_EVENTS_DIR=/tmp/rc-typed-persistent timeout 65s bash scripts/test_ros_sensor_bridge.sh persistent_shm 250 10
          test -s /tmp/rc-typed-persistent/paired_events.csv

  shm-loan-functional-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHM copied and loaned paths across two processes (functional only)
        shell: bash
        run: |
          RUNS=2 SAMPLES=12 WARMUP=4 PAYLOADS="64 4096" \
            timeout 120s bash scripts/run_shm_path_benchmark.sh
          test "$(find results/raw -name 'r*_*.csv' | wc -l)" -eq 8
          test "$(find results/raw -name 'shm_path_report.md' -size +0c | wc -l)" -eq 1
      - name: CI runs must not be interpreted as performance evidence
        run: echo "Functional delivery and report validation only; not a performance benchmark."

  shm-load-functional-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete copied/loaned SHM traces under deliberate backpressure
        shell: bash
        run: |
          RUNS=2 FRAMES=30 PAYLOADS="64 4096" DELAYS_US="0 250" \
            timeout 100s bash scripts/run_shm_load.sh
          test "$(find results/raw -name '*.sender.csv' | wc -l)" -eq 16
          test "$(find results/raw -name '*.receiver.csv' | wc -l)" -eq 16
          test "$(find results/raw -name 'load_report.md' -size +0c | wc -l)" -eq 1
      - name: Never interpret virtualized CI latency as comparative evidence
        run: echo "Checks frame correctness, pairing, and completion only."
